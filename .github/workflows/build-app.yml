name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Assemble resources (panel code + deps + node runtime)
        shell: bash
        run: |
          set -e
          mkdir -p app/resources/app app/resources/node
          cp server.mjs 4_fleet.mjs lib.mjs dashboard.html params.json package.json package-lock.json app/resources/app/
          cd app/resources/app
          npm ci --omit=dev --ignore-scripts
          find node_modules -type d \( -name test -o -name tests -o -name docs -o -name examples -o -name __tests__ \) -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "*.md" -delete 2>/dev/null || true
          find node_modules -name "*.ts" -not -name "*.d.ts" -delete 2>/dev/null || true
          find node_modules -name "*.map" -delete 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          curl -sLO https://nodejs.org/dist/v22.23.3/node-v22.23.3-win-x64.zip
          unzip -q node-v22.23.3-win-x64.zip
          cp -r node-v22.23.3-win-x64/* app/resources/node/

      - name: Build NSIS installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: solana-fleet-panel-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/src-tauri/target/release/bundle/nsis/*.exe
